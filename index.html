<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta http-equiv='refresh' content='2'>
<title>Récapitulatif de Pénalités</title>
<style>
body { font-family: Arial; background-color: #111; color: white; }
table { border-collapse: collapse; width: 95%; margin: auto; font-size: 24px; }
th, td { border: 1px solid #555; padding: 10px; text-align: center; }
th { background-color: #222; color: #f5f5f5; }
td.red { color: red; font-weight: bold; }
.title { text-align:center; font-size:30pt; color:white; margin:0; }
.subline-container { display:flex; justify-content:space-between; align-items:center; width:95%; margin: 5px auto 20px auto; }
.subline-center { flex: 1; text-align:center; font-size:18pt; font-weight:bold; color:yellow; }
.subline-right { text-align:right; font-size:14pt; font-weight:bold; color:yellow; min-width:200px; }
</style>
</head>
<body>
<h1 class='title'>Récapitulatif de Pénalités</h1>
<div class='subline-container'>
  <div class='subline-center'>F.Ford Kent</div>
  <div class='subline-right'>Course 1</div>
</div>
<table>
<tr>
  <th>Numéro</th>
  <th>Nombre de fois (RC)</th>
  <th>Pénalité 5 sec</th>
  <th>Pénalité 10 sec</th>
  <th>Pénalité 15 sec</th>
  <th>Drive Through</th>
  <th>Total</th>
</tr>
</table>
</body>
</html>
